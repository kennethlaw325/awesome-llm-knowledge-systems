site_name: LLM Knowledge Engineering in 2026
site_description: >-
  The map everyone's missing: RAG, context engineering, harness engineering,
  skill systems, agent memory and MCP as one connected ecosystem.
site_url: https://kennethlaw325.github.io/awesome-llm-knowledge-systems/
repo_url: https://github.com/kennethlaw325/awesome-llm-knowledge-systems
repo_name: kennethlaw325/awesome-llm-knowledge-systems
# The staged paths under build/docs/ are not the source paths, so an edit
# button would point at files that do not exist on the branch.
edit_uri: ""

# scripts/stage_docs.py copies the repo's markdown here; mkdocs refuses a
# docs_dir that contains mkdocs.yml.  Previewing locally is therefore two
# commands, not one:
#     python scripts/stage_docs.py
#     mkdocs serve            # or: mkdocs build --strict
# `mkdocs serve` watches build/docs, not chapters/ -- after editing a chapter,
# a README or a translation, re-run the staging script to see the change.
docs_dir: build/docs
site_dir: build/site

validation:
  links:
    # README/chapters link to chapters as /chapters/NN-x.md, which GitHub
    # resolves against the repo root.
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn

# English chapter navigation stays compact; language entry points below lead
# to complete translated reading paths. Other translated pages stay off-nav.
not_in_nav: |
  translations/**

theme:
  name: material
  palette:
    # `custom` leaves the colour to docs-site/extra.css.  Material stamps the
    # named palettes onto <body>, which shadows any :root value on <html>, so
    # the repo's #2563eb only lands once nothing claims the name here.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Home: index.md
  - Foundations:
      - "01 · The Three Generations": chapters/01-evolution.md
      - "02 · RAG & Knowledge Graphs": chapters/02-knowledge-layer.md
      - "03 · Context Engineering": chapters/03-context-engineering.md
  - Building the System:
      - "04 · Harness Engineering": chapters/04-harness-engineering.md
      - "05 · Skills & Skill Graphs": chapters/05-skill-systems.md
      - "06 · Agent Memory": chapters/06-agent-memory.md
      - "07 · MCP & Interoperability": chapters/07-mcp.md
  - In Practice:
      - "08 · Knowledge Management Tools": chapters/08-tools-landscape.md
      - "09 · The Chinese AI Ecosystem": chapters/09-china-ecosystem.md
      - "10 · A Real-World Harness": chapters/10-case-study.md
      - "11 · Timeline": chapters/11-timeline.md
      - "12 · Local Models": chapters/12-local-models.md
  - Emerging Patterns:
      - "13 · Loop Engineering": chapters/13-loop-engineering.md
      - "14 · Graph Engineering": chapters/14-graph-engineering.md
  - Glossary: glossary.md
  - Translations:
      - 繁體中文: translations/README-zh.md
      - 简体中文: translations/README_zh-CN.md
      - 日本語: translations/README_ja.md
      - 한국어: translations/README_ko.md
      - Español: translations/README_es.md
  - About:
      - Changelog: CHANGELOG.md
      - Contributing: CONTRIBUTING.md
